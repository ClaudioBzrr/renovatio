                "@type": "Question",

                  "@type": "Answer",

                "@type": "Question",
                "name": "Does Renovatio work offline?",

                "@type": "Question",
                "name": "How is my data stored?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "All records stay in the browser's local storage on the device. Encrypted backups use AES-256-GCM with a password chosen by the user. No account, cloud or analytics is used."
